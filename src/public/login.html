<!doctype html><html lang="ht"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Konekte • WhatsApp Bot</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08111f;color:#eef5ff;font:16px system-ui,Arial}.card{width:min(92vw,390px);padding:28px;border-radius:18px;background:#10213a;border:1px solid #2a4262}h1{font-size:24px;margin-top:0}p{color:#a9bdd7;font-size:14px}input,button{width:100%;padding:13px;border-radius:10px;font:inherit}input{background:#091729;color:white;border:1px solid #39516f;margin:10px 0}button{border:0;background:#167dff;color:white;font-weight:700;cursor:pointer}#err{color:#ff9eaa;font-size:13px;min-height:18px}
</style></head><body><form class="card" id="form"><h1>🔐 WhatsApp Bot</h1><p>Antre modpas admin ou pou ouvri dashboard la.</p><input id="password" type="password" autocomplete="current-password" placeholder="Modpas admin" required><button>Antre</button><div id="err"></div></form><script>
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const err=document.getElementById("err");err.textContent="";try{const r=await fetch("/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("password").value})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Echèk");location.href="/"}catch(x){err.textContent=x.message}});
</script></body></html>
